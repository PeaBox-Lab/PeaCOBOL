[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "peacobol"
version = "1.2.0"
description = "Local-first COBOL data, development and assurance toolkit"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
[project.scripts]
peacobol = "peacobol.cli:main"
peacobol-ui = "peacobol.server:main"
peacobol-gui = "peacobol.__main__:main"
[tool.setuptools]
packages = ["peacobol"]
